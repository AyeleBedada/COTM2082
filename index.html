<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CoTM Curriculum Quest</title>
<link rel="stylesheet" href="style.css">
<!-- this is optional -->

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">

<!-- this is optional -->

</head>
<body>

<div class="game">
    <h1>🏗 CoTM CURRICULUM QUEST</h1>

    <svg viewBox="0 0 700 120">
        <line x1="50" y1="60" x2="650" y2="60"/>
        <circle cx="50" cy="60" r="20"/>
        <circle cx="180" cy="60" r="20"/>
        <circle cx="310" cy="60" r="20"/>
        <circle cx="440" cy="60" r="20"/>
        <circle cx="570" cy="60" r="20"/>
        <text x="45" y="65">I</text>
        <text x="172" y="65">II</text>
        <text x="300" y="65">III</text>
        <text x="430" y="65">IV</text>
        <text x="560" y="65">V</text>
    </svg>

    <div id="stats">
        <span>⭐ <b id="score">0</b></span>
        <span>🔥 <b id="streak">0</b></span>
        <span>❤️ <b id="lives">3</b></span>
        <span>📘 <b id="count">1</b>/30</span>
    </div>

    <h2 id="question"></h2>
    <div id="answers"></div>
    <div id="feedback"></div>

    <button onclick="nextQuestion()">Next</button>
</div>

<script src="questions.js"></script>
<script src="engine.js"></script>
</body>
</html>
