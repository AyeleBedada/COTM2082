    <style>
        /* Basic reset to ensure the layout covers the whole screen */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: sans-serif;
        }

        /* The container for the columns, set to display as flex */
        .flex-container {
            display: flex;
            height: 100vh; /* This makes the container take up the full viewport height */
            width: 100%;
        }

        /* Styles for the left column (20%) */
        .left-column {
            width: 20%;
            background-color: #f0f0f0; /* Light gray background for visibility */
            padding: 20px;
            box-sizing: border-box; /* Ensures padding and border are included in the 20% width */
        }

        /* Styles for the right column (80%) */
        .right-column {
            width: 80%;
            background-color: #ffffff; /* White background */
            padding: 20px;
            box-sizing: border-box; /* Ensures padding and border are included in the 80% width */
        }

        /* Optional: Add a media query for responsiveness (stacks columns on small screens) */
        @media screen and (max-width: 768px) {
            .flex-container {
                flex-direction: column;
            }
            .left-column, .right-column {
                width: 100%; /* Stacks the columns vertically */
                height: auto;
            }
        }
    </style>
